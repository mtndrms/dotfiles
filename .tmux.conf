set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

unbind %
bind - split-window -h

unbind '"'
bind = split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on

set -sg escape-time 0

# -----------------------------
# TOKYO NIGHT COLORS
# -----------------------------
set -g @tokyo_bg "#1a1b26"
set -g @tokyo_bg_dark "#16161e"
set -g @tokyo_fg "#c0caf5"
set -g @tokyo_blue "#7aa2f7"
set -g @tokyo_cyan "#7dcfff"
set -g @tokyo_green "#9ece6a"
set -g @tokyo_orange "#ff9e64"
set -g @tokyo_purple "#bb9af7"
set -g @tokyo_red "#f7768e"
set -g @tokyo_gray "#565f89"

# -----------------------------
# STATUS BAR
# -----------------------------
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#16161e,fg=#c0caf5"

set -g status-left-length 100
set -g status-right-length 150

# Left
set -g status-left "#[fg=#7aa2f7,bold]  #S #[fg=#565f89]| #[fg=#7dcfff]"

# Right
set -g status-right "#[fg=#9ece6a]#(whoami) #[fg=#565f89]| #[fg=#bb9af7]%Y-%m-%d #[fg=#7aa2f7]%H:%M "

# Window tabs
setw -g window-status-format " #[fg=#565f89]#I:#W "
setw -g window-status-current-format "#[bg=#7aa2f7,fg=#1a1b26,bold] #I:#W "
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#565f89"
set -g pane-active-border-style "fg=#7aa2f7"

# Messages
set -g message-style "bg=#7aa2f7,fg=#1a1b26"

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'
